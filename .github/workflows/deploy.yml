name: Deploy

on:
  push:
    branches: [master]

jobs:
  migrate-database:
    name: Run DB Migrations (Supabase)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply pending migrations
        run: |
          supabase db push \
            --db-url "postgresql://postgres.${{ secrets.SUPABASE_PROJECT_REF }}:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-eu-west-2.pooler.supabase.com:6543/postgres"

  # El deploy de la web lo hace la integración Git de Vercel automáticamente
  # en cada push a master. No se despliega desde aquí para evitar dos rutas de
  # deploy compitiendo entre sí (la del CLI subía apps/web como raíz del build).
